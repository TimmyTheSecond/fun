<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Classes</title>
    <link rel="stylesheet" href="gamesdesign.css">
    <link rel="icon" href="assets/gGames.jpg">
    <style>
        .feedback-main { width:min(680px, calc(100% - 32px)); margin:46px auto; }
        .feedback-card { padding:clamp(22px,5vw,38px); border:1px solid var(--line); border-radius:22px; background:linear-gradient(155deg,#151e2f,#101725); box-shadow:0 18px 50px rgba(0,0,0,.24); }
        .feedback-card h1 { margin:0 0 12px; font-size:clamp(30px,5vw,44px); }
        .feedback-card p { color:var(--muted); line-height:1.7; }
        .feedback-link-button { display:inline-flex; min-height:46px; align-items:center; padding:0 20px; border-radius:11px; color:#111426; background:var(--accent-bright); font-weight:700; text-decoration:none; }
        .feedback-link-button:hover { background:#d0caff; }
    </style>
</head>
<body>
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">▶</span><span>Classes</span></a><a class="backup-link" href="index.html">All games <span aria-hidden="true">↗</span></a></header>
    <main class="feedback-main">
        <section class="feedback-card" aria-labelledby="feedback-title">
            <h1 id="feedback-title">Game feedback</h1>
            <p>Use the form to report a game or share feedback.</p>
            <a class="feedback-link-button" href="https://docs.google.com/forms/d/e/1FAIpQLSduSqSDUYzhNrz-5Ma_DIyV7inqtkY7JyVpPemY4zXF_Qyd4g/viewform" target="_blank" rel="noopener noreferrer">Open feedback form ↗</a>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Report a game</title>
    <link rel="stylesheet" href="gamesdesign.css">
    <link rel="icon" href="assets/gGames.jpg">
    <style>
        .report-main { width:min(680px, calc(100% - 32px)); margin:46px auto; }
        .report-card { padding:clamp(22px,5vw,38px); border:1px solid var(--line); border-radius:22px; background:linear-gradient(155deg,#151e2f,#101725); box-shadow:0 18px 50px rgba(0,0,0,.24); }
        .report-card h1 { margin:0 0 12px; font-size:clamp(30px,5vw,44px); }
        .report-intro { margin:0 0 28px; color:var(--muted); line-height:1.7; }
        .report-form { display:grid; gap:18px; }
        .report-form label { display:grid; gap:8px; color:var(--text); font-size:13px; font-weight:700; }
        .report-form select, .report-form textarea { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:11px; color:var(--text); background:#0d1422; font:inherit; font-size:14px; }
        .report-form textarea { min-height:130px; resize:vertical; }
        .report-form select:focus, .report-form textarea:focus { outline:2px solid var(--accent); outline-offset:2px; }
        .report-game { margin:0 0 22px; color:var(--muted); }
        .report-game strong { color:var(--text); }
        .report-submit { justify-self:start; min-height:46px; padding:0 20px; border:0; border-radius:11px; color:#111426; background:var(--accent-bright); font:700 14px Montserrat,Arial,sans-serif; cursor:pointer; }
        .report-submit:hover { background:#d0caff; }
        .report-status { min-height:24px; margin:0; color:#b7adff; font-size:13px; line-height:1.6; }
        .report-back { display:inline-block; margin-bottom:22px; color:#b7adff; font-size:13px; text-decoration:none; }
        .report-back:hover { color:#fff; }
    </style>
    <script src="report.js" defer></script>
</head>
<body>
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">▶</span><span>THE <span class="brand-accent">ARCADE</span></span></a><a class="backup-link" href="index.html">All games <span aria-hidden="true">↗</span></a></header>
    <main class="report-main">
        <a class="report-back" href="index.html">← Back to games</a>
        <section class="report-card" aria-labelledby="report-title">
            <p class="eyebrow">HELP KEEP THE ARCADE RUNNING</p>
            <h1 id="report-title">Report a game</h1>
            <p class="report-intro">Tell us what’s wrong with this game. Add details if they’ll help us investigate.</p>
            <p class="report-game" id="reportGame"></p>
            <form class="report-form" id="reportForm">
                <label for="reason">What’s the issue?
                    <select id="reason" name="reason" required>
                        <option value="">Choose a reason</option>
                        <option>Game doesn't work</option>
                        <option>Game is blocked</option>
                        <option>Game is not appropriate</option>
                    </select>
                </label>
                <label for="description">Description <span style="color:var(--muted);font-weight:400">(optional)</span>
                    <textarea id="description" name="description" maxlength="1000" placeholder="What happened? Include any helpful details."></textarea>
                </label>
                <p class="report-status" id="reportStatus" role="status" aria-live="polite"></p>
                <button class="report-submit" type="submit">Confirm report</button>
            </form>
        </section>
    </main>
</body>
</html>
